name: Discord Notifications

on:
  push:
    branches:
      - main
      - development

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1501701753962369096/pXaf0LTFLcZ5TRp0TShJo4fC0NfN5KV9dgXMIBt0YWkefAKagYHQ3TN45eevPinPlnt3
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_URL: ${{ github.event.head_commit.url }}

        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"content\": \"🚀 **New Commit on Zorvax Core**\n\n📦 Repository: ${REPO_NAME}\n🌿 Branch: ${BRANCH_NAME}\n👨‍💻 Author: ${COMMIT_AUTHOR}\n📝 Commit: ${COMMIT_MESSAGE}\n🔗 ${COMMIT_URL}\"
          }" \
          $DISCORD_WEBHOOK