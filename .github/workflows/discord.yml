name: Discord Notifications

on:
  push:
    branches:
      - main
      - development

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Embed Notification
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1501701753962369096/pXaf0LTFLcZ5TRp0TShJo4fC0NfN5KV9dgXMIBt0YWkefAKagYHQ3TN45eevPinPlnt3
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_URL: ${{ github.event.head_commit.url }}

        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"Zorvax GitHub\",
            \"avatar_url\": \"https://i.imgur.com/4M34hi2.png\",
            \"embeds\": [{
              \"title\": \"🚀 New Commit on Zorvax Core\",
              \"color\": 65450,
              \"fields\": [
                {
                  \"name\": \"📦 Repository\",
                  \"value\": \"${REPO_NAME}\",
                  \"inline\": true
                },
                {
                  \"name\": \"🌿 Branch\",
                  \"value\": \"${BRANCH_NAME}\",
                  \"inline\": true
                },
                {
                  \"name\": \"👨‍💻 Author\",
                  \"value\": \"${COMMIT_AUTHOR}\",
                  \"inline\": true
                },
                {
                  \"name\": \"📝 Commit\",
                  \"value\": \"${COMMIT_MESSAGE}\"
                }
              ],
              \"url\": \"${COMMIT_URL}\",
              \"footer\": {
                \"text\": \"Zorvax Core Development Pipeline\"
              }
            }]
          }" \
          $DISCORD_WEBHOOK